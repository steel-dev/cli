version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rustcrypto:
        patterns:
          - "aes"
          - "aes-gcm"
          - "cbc"
          - "hmac"
          - "pbkdf2"
          - "sha1"
          - "sha2"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
